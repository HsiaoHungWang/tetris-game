<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris with AI Coach</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-container {
      display: flex;
      gap: 20px;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      justify-content: center;
    }
    .canvas-wrapper {
      position: relative;
      border: 4px solid #444;
      border-radius: 4px;
    }
    canvas {
      background-color: #000;
      display: block;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 220px;
    }
    .panel {
      background: #333;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #00d2ff;
    }
    .panel h2 {
      font-size: 13px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 4px;
    }
    .panel p {
      font-size: 22px;
      font-weight: bold;
      color: #00d2ff;
    }
    .coach-panel {
      border-left-color: #ff0055;
      background: #3a2230;
    }
    .coach-panel p {
      font-size: 16px;
      color: #ff5588;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #00d2ff;
      border: none;
      color: #000;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #0099cc;
      color: #fff;
    }
    button.secondary {
      background: #555;
      color: #fff;
    }
    button.secondary:hover {
      background: #777;
    }
    .controls-hint {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="tetris" width="240" height="400"></canvas>
  </div>

  <div class="sidebar">
    <div class="panel">
      <h2>Score</h2>
      <p id="score">0</p>
    </div>
    
    <div class="panel coach-panel">
      <h2>AI Coach Recommendation</h2>
      <p id="coach-hint">Start the game!</p>
    </div>

    <div class="btn-group">
      <button id="start-btn">Start Game</button>
      <button id="pause-btn" class="secondary" disabled>Pause (P)</button>
      <button id="music-btn" class="secondary">Music: ON</button>
    </div>

    <div class="panel controls-hint">
      <h2>Controls</h2>
      <p>← / → : Move Left/Right</p>
      <p>↑ : Rotate</p>
      <p>↓ : Soft Drop</p>
      <p>Space : Hard Drop</p>
      <p>P : Pause / Resume</p>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
context.scale(20, 20);

// --- 音效與音樂系統 (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let isMusicOn = true;
let bgmInterval = null;

function playTone(freq, type, duration, volume = 0.05) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// Tetris 音樂旋律 (Korobeiniki 簡易版)
const bgmNotes = [
  {f: 659, d: 250}, {f: 493, d: 125}, {f: 523, d: 125}, {f: 587, d: 250}, {f: 523, d: 125}, {f: 493, d: 125},
  {f: 440, d: 250}, {f: 440, d: 125}, {f: 523, d: 125}, {f: 659, d: 250}, {f: 587, d: 125}, {f: 523, d: 125},
  {f: 493, d: 375}, {f: 523, d: 125}, {f: 587, d: 250}, {f: 659, d: 250},
  {f: 523, d: 250}, {f: 440, d: 250}, {f: 440, d: 500}
];

let bgmIndex = 0;
let bgmTimer = null;

function playNextNote() {
  if (!isMusicOn || gameOver || isPaused) return;
  const note = bgmNotes[bgmIndex];
  playTone(note.f, 'square', note.d / 1000, 0.02);
  bgmIndex = (bgmIndex + 1) % bgmNotes.length;
  bgmTimer = setTimeout(playNextNote, note.d + 50);
}

function startBGM() {
  stopBGM();
  if (isMusicOn) {
    bgmIndex = 0;
    playNextNote();
  }
}

function stopBGM() {
  if (bgmTimer) {
    clearTimeout(bgmTimer);
    bgmTimer = null;
  }
}

// --- 遊戲邏輯與變數 ---
const arena = createMatrix(12, 20);

const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0,
};

let gameOver = true;
let isPaused = false;

const colors = [
  null,
  '#FF0D72', '#0DC2FF', '#0DFF72',
  '#F538FF', '#FF8E0D', '#FFE135', '#3877FF'
];

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

function createPiece(type) {
  if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
  if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
  if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
  if (type === 'O') return [[4, 4],[4, 4]];
  if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
  if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
  if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
}

function draw() {
  context.fillStyle = '#000';
  context.fillRect(0, 0, canvas.width, canvas.height);

  drawMatrix(arena, {x: 0, y: 0});
  
  if (!gameOver && player.matrix) {
    drawGhost();
    drawMatrix(player.matrix, player.pos);
  }

  // 暫停畫面提示
  if (isPaused) {
    context.fillStyle = 'rgba(0, 0, 0, 0.75)';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = '#fff';
    context.font = '1.5px sans-serif';
    context.textAlign = 'center';
    context.fillText('PAUSED', 6, 10);
  }
}

function drawMatrix(matrix, offset, isGhost = false) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        if (isGhost) {
          context.fillStyle = 'rgba(255, 255, 255, 0.2)';
        } else {
          context.fillStyle = colors[value];
        }
        context.fillRect(x + offset.x, y + offset.y, 1, 1);
        context.lineWidth = 0.05;
        context.strokeStyle = '#000';
        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

function drawGhost() {
  const ghostPos = {x: player.pos.x, y: player.pos.y};
  while (!collide(arena, {pos: ghostPos, matrix: player.matrix})) {
    ghostPos.y++;
  }
  ghostPos.y--;
  drawMatrix(player.matrix, ghostPos, true);
}

function collide(arena, player) {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
         (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        arena[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerDrop() {
  if (isPaused) return;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    playTone(150, 'triangle', 0.1);
    playerReset();
    arenaSweep();
    updateScore();
  }
  dropCounter = 0;
}

function playerHardDrop() {
  if (isPaused) return;
  while (!collide(arena, player)) {
    player.pos.y++;
  }
  player.pos.y--;
  merge(arena, player);
  playTone(200, 'square', 0.1);
  playerReset();
  arenaSweep();
  updateScore();
  dropCounter = 0;
}

function playerMove(dir) {
  if (isPaused) return;
  player.pos.x += dir;
  if (collide(arena, player)) {
    player.pos.x -= dir;
  } else {
    playTone(400, 'sine', 0.05);
  }
  getCoachAdvice();
}

function playerRotate(dir) {
  if (isPaused) return;
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
  playTone(500, 'sine', 0.05);
  getCoachAdvice();
}

function playerReset() {
  const pieces = 'ILJOTSZ';
  player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
  player.pos.y = 0;
  player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
  
  if (collide(arena, player)) {
    arena.forEach(row => row.fill(0));
    stopBGM();
    alert("Game Over! Final Score: " + player.score);
    player.score = 0;
    gameOver = true;
    document.getElementById('pause-btn').disabled = true;
    document.getElementById('coach-hint').innerText = "Game Over!";
  }
  getCoachAdvice();
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y > 0; --y) {
    for (let x = 0; x < arena[y].length; ++x) {
      if (arena[y][x] === 0) continue outer;
    }
    const row = arena.splice(y, 1)[0].fill(0);
    arena.unshift(row);
    ++y;
    player.score += rowCount * 10;
    rowCount *= 2;
    playTone(800, 'sawtooth', 0.2);
  }
}

// AI 教練功能
function getCoachAdvice() {
  if (gameOver || isPaused) return;
  
  let bestScore = -Infinity;
  let bestMove = { x: player.pos.x, rotations: 0 };

  for (let r = 0; r < 4; r++) {
    let testMatrix = JSON.parse(JSON.stringify(player.matrix));
    for (let i = 0; i < r; i++) rotate(testMatrix, 1);

    for (let x = -2; x < arena[0].length; x++) {
      let testPos = { x: x, y: player.pos.y };
      if (collide(arena, { pos: testPos, matrix: testMatrix })) continue;

      while (!collide(arena, { pos: testPos, matrix: testMatrix })) {
        testPos.y++;
      }
      testPos.y--;

      let score = testPos.y * 10 - Math.abs(x - (arena[0].length / 2));
      if (score > bestScore) {
        bestScore = score;
        bestMove = { x: x, rotations: r };
      }
    }
  }

  const hintEl = document.getElementById('coach-hint');
  if (bestMove.rotations > 0) {
    hintEl.innerText = "旋轉方向 (Rotate)!";
  } else if (player.pos.x < bestMove.x) {
    hintEl.innerText = "向右移動 (Move Right)";
  } else if (player.pos.x > bestMove.x) {
    hintEl.innerText = "向左移動 (Move Left)";
  } else {
    hintEl.innerText = "完美位置，直接放下! (Drop)";
  }
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;

function update(time = 0) {
  if (gameOver) return;

  const deltaTime = time - lastTime;
  lastTime = time;

  if (!isPaused) {
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
      playerDrop();
    }
  }

  draw();
  requestAnimationFrame(update);
}

function updateScore() {
  document.getElementById('score').innerText = player.score;
}

function togglePause() {
  if (gameOver) return;
  isPaused = !isPaused;
  const pauseBtn = document.getElementById('pause-btn');
  if (isPaused) {
    pauseBtn.innerText = "Resume (P)";
    stopBGM();
    document.getElementById('coach-hint').innerText = "Game Paused";
  } else {
    pauseBtn.innerText = "Pause (P)";
    startBGM();
    getCoachAdvice();
  }
  draw();
}

// 控制事件綁定
document.addEventListener('keydown', event => {
  if (event.keyCode === 80) { // 'P' 鍵控制暫停
    togglePause();
    return;
  }

  if (gameOver || isPaused) return;

  if (event.keyCode === 37) playerMove(-1);
  else if (event.keyCode === 39) playerMove(1);
  else if (event.keyCode === 40) playerDrop();
  else if (event.keyCode === 38) playerRotate(1);
  else if (event.keyCode === 32) playerHardDrop();
});

document.getElementById('start-btn').addEventListener('click', () => {
  arena.forEach(row => row.fill(0));
  player.score = 0;
  updateScore();
  gameOver = false;
  isPaused = false;
  document.getElementById('pause-btn').disabled = false;
  document.getElementById('pause-btn').innerText = "Pause (P)";
  document.getElementById('start-btn').innerText = "Restart Game";
  playerReset();
  update();
  startBGM();
});

document.getElementById('pause-btn').addEventListener('click', () => {
  togglePause();
});

document.getElementById('music-btn').addEventListener('click', () => {
  isMusicOn = !isMusicOn;
  const btn = document.getElementById('music-btn');
  btn.innerText = `Music: ${isMusicOn ? 'ON' : 'OFF'}`;
  if (isMusicOn && !gameOver && !isPaused) {
    startBGM();
  } else {
    stopBGM();
  }
});

draw();
</script>
</body>
</html>
